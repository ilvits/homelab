# /mnt/user/appdata/compose/cups/compose.yaml
services:
  cups:
    image: olbat/cupsd:latest
    container_name: cups
    restart: unless-stopped
    ports:
      - "631:631"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /mnt/user/appdata/cups/etc:/etc/cups
      - /mnt/user/appdata/cups/spool:/var/spool/cups
      - /mnt/user/appdata/cups/log:/var/log/cups
      - /var/run/dbus:/var/run/dbus          # required for dnssd/AirPrint advertising
    ulimits:
      nofile:                                # cupsdDoSelect() breaks on Docker's default (see olbat/dockerfiles#111)
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "lpstat -r || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
